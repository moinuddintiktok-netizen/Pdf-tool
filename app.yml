
app:
  name: "Smart PDF Studio"
  version: "1.0.0"
  author: "Moinuddin Chishti"
  mode: "offline-first"
  ui:
    framework: "CustomTkinter"
    theme: "VIP dark neon"
    responsive: true
    high_dpi: true

features:
  smart_pdf_toolkit:
    word_to_pdf: true
    pdf_to_word: true
    images_to_pdf: true
    merge_pdf: true
    split_pdf: true
    password_protect_pdf: true
    unlock_pdf_with_password: true
  pc_cleaner:
    temp_file_scan: true
    preview_before_delete: true
    disk_overview: true
    duplicate_finder: true
  file_organizer:
    extension_based_categories: true
    collision_safe_moves: true

flutter_port:
  target: "Dart/Flutter"
  notes: "This YAML is a feature/config contract for a future Flutter port."
  suggested_packages:
    pdf: "syncfusion_flutter_pdf or another license-compatible PDF package"
    file_system: "path_provider"
    file_picker: "file_picker"
    archive: "archive"
    state: "provider / riverpod"
