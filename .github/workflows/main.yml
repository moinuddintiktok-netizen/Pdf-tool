name: Smart PDF Studio - Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Check Python source
        shell: pwsh
        run: |
          python -m py_compile app.py
          python -m py_compile core/pdf_tools.py
          python -m py_compile core/file_tools.py

      - name: Build Windows EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "SmartPDFStudio" `
            --collect-all customtkinter `
            --hidden-import "PIL._tkinter_finder" `
            --hidden-import "docx" `
            --hidden-import "reportlab" `
            --hidden-import "pypdf" `
            --hidden-import "cryptography" `
            app.py

      - name: Prepare release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release" | Out-Null
          Copy-Item "dist\SmartPDFStudio.exe" "release\SmartPDFStudio.exe"
          if (Test-Path "README.md") {
            Copy-Item "README.md" "release\README.md"
          }
          if (Test-Path "LICENSE") {
            Copy-Item "LICENSE" "release\LICENSE"
          }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SmartPDFStudio-Windows
          path: release/
          if-no-files-found: error
          retention-days: 30
